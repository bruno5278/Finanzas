<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis Finanzas</title>
<style>
:root{
 --bg:#10151e;--panel:#1a2230;--panel2:#242e3e;--text:#f5f7fb;
 --muted:#a4b0c1;--line:#303d50;--cyan:#45c9d6;
 --green:#43d6a0;--orange:#ffad5c;--pink:#f27da8;
 --blue:#6ca9ff;--yellow:#f2d36d;--purple:#9677f5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.sidebar{background:#151c28;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:11px;padding:5px 9px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#45c9d6,#43d6a0,#9677f5);display:grid;place-items:center;font-size:22px}
.brand h2{font-size:17px;margin:0}.brand small{color:var(--muted)}
.nav-label{font-size:10px;color:#8290a6;letter-spacing:1.5px;font-weight:800;padding:0 12px;margin-bottom:6px}
nav{display:grid;gap:6px}
.nav-btn{background:transparent;color:var(--muted);padding:12px;border-radius:12px;text-align:left;display:flex;gap:12px;align-items:center}
.nav-btn:hover{background:#263346;color:white}
.nav-btn.active{background:linear-gradient(100deg,#344b65,#29364c);color:white;box-shadow:inset 3px 0 var(--cyan)}
.nav-icon{font-size:17px;width:22px;text-align:center}
.sidebar-bottom{margin-top:auto;color:var(--muted);font-size:12px;padding:10px}
main{padding:30px;max-width:1500px;width:100%;margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:27px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:13px}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{background:var(--panel2);color:white;padding:10px 15px;border-radius:11px;font-weight:650;font-size:13px}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:linear-gradient(120deg,#638cf7,#9677f5)}
.btn.green{background:#198d70}.btn.danger{background:#87394c}
.btn.small{padding:7px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:19px;min-width:0}
.stat{grid-column:span 3;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;width:105px;height:105px;border-radius:50%;right:-35px;top:-40px;background:var(--glow,#45c9d6);opacity:.13}
.stat-icon{font-size:21px;margin-bottom:12px}
.stat-label{color:var(--muted);font-size:12px}
.stat-value{font-size:24px;font-weight:850;margin:9px 0 4px;overflow-wrap:anywhere}
.stat-note{font-size:11px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}
.section-head h2{font-size:17px;margin:0}.section-head p{color:var(--muted);font-size:12px;margin:5px 0 0}
.account-grid,.group-grid,.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.account-card,.group-card{border-radius:18px;padding:18px;min-height:150px;position:relative;overflow:hidden;color:white;box-shadow:0 10px 25px #0002}
.account-card:after,.group-card:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#ffffff15;right:-45px;top:-65px;pointer-events:none}
.account-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.account-type{font-size:11px;opacity:.85}
.account-name{font-weight:750;font-size:17px;margin-top:7px;overflow-wrap:anywhere}
.account-balance{font-size:25px;font-weight:850;margin-top:18px}
.account-actions{display:flex;gap:7px;margin-top:12px;position:relative;z-index:1}
.account-actions button{background:#ffffff25;color:white;padding:6px 9px;border-radius:8px;font-size:11px}
.group-balances{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px;position:relative;z-index:1}
.group-balance{background:#ffffff20;border:1px solid #ffffff25;padding:10px;border-radius:11px}
.group-balance small{display:block;font-size:10px;opacity:.85;margin-bottom:4px}
.group-balance strong{font-size:15px}
.group-members{margin-top:12px;font-size:11px;opacity:.9;line-height:1.7;position:relative;z-index:1}
.item-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}
.item-card h3{margin:0 0 6px;font-size:15px}.item-card p{color:var(--muted);font-size:12px;margin:5px 0}
.item-actions{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.money{font-weight:800;font-size:20px}
.progress{height:9px;background:#30394c;border-radius:99px;overflow:hidden;margin:12px 0 7px}
.progress>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#45c9d6,#43d6a0)}
.progress.over>div{background:var(--pink)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px}
.positive{color:var(--green)}.negative{color:var(--pink)}
.cash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}
.cash-note{border-radius:16px;padding:15px;color:#182033;min-height:145px;position:relative;overflow:hidden}
.cash-note:after{content:"";position:absolute;border:2px solid #ffffff70;width:100px;height:100px;border-radius:50%;right:-25px;top:-30px}
.cash-note .denom{font-size:23px;font-weight:900}
.cash-note .animal{font-size:11px;opacity:.8;margin:4px 0 12px}
.cash-note input{width:75px;background:#ffffffbb;color:#182033;border:1px solid #ffffff90;border-radius:8px;padding:7px}
.cash-note .total{font-size:12px;font-weight:750;margin-top:9px}
.violet{background:linear-gradient(130deg,#d9b8f4,#a77ad0)}
.blue{background:linear-gradient(130deg,#9edcff,#4e9ed2)}
.green-note{background:linear-gradient(130deg,#c3e9a4,#6bbd80)}
.orange{background:linear-gradient(130deg,#ffd18b,#ed8c36)}
.pink-note{background:linear-gradient(130deg,#e5c4d5,#8e8794)}
.sky{background:linear-gradient(130deg,#e2f6ff,#8cc9e9)}
.cream{background:linear-gradient(130deg,#f3e7c9,#8eafd7)}
.cash-total{font-size:26px;font-weight:850;margin:15px 0}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px;font-size:13px}
.notice{padding:12px 14px;border-radius:12px;background:#25394a;color:#aee9ed;font-size:12px;margin:12px 0}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-size:12px;color:var(--muted);font-weight:650}
.field input,.field select{width:100%;background:#111a27;border:1px solid var(--line);color:white;padding:11px;border-radius:10px;outline:none}
.field input:focus,.field select:focus{border-color:var(--cyan)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field input[type=color]{height:43px;padding:4px}
.modal-bg{position:fixed;inset:0;background:#050812d9;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:22px;width:min(540px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #0008}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modal-head h2{font-size:19px;margin:0}.close{background:transparent;color:var(--muted);font-size:23px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.check-list{display:grid;gap:8px;margin-top:8px}
.check-list label{font-size:13px;color:var(--muted)}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.quick-card{padding:16px;border-radius:16px;color:white;text-align:left;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}
.quick-card:hover{transform:translateY(-3px);filter:brightness(1.08)}
.quick-card span:first-child{font-size:23px}
.quick-card strong{font-size:13px}.quick-card small{font-size:11px;opacity:.85}
.q-cyan{background:linear-gradient(135deg,#1597a8,#45c9d6)}
.q-green{background:linear-gradient(135deg,#168c68,#43d6a0)}
.q-orange{background:linear-gradient(135deg,#d47a35,#ffad5c)}
.q-pink{background:linear-gradient(135deg,#bb4e7d,#f27da8)}
.q-blue{background:linear-gradient(135deg,#426cc2,#6ca9ff)}
.q-purple{background:linear-gradient(135deg,#7356cb,#aa91ff)}
@media(max-width:950px){
 .app{grid-template-columns:1fr}
 .sidebar{padding:12px;position:sticky;top:0;z-index:5;border-right:0;border-bottom:1px solid var(--line)}
 .brand{display:none}.nav-label,.sidebar-bottom{display:none}
 nav{display:flex;overflow-x:auto}.nav-btn{white-space:nowrap;padding:10px}
 main{padding:20px}.stat{grid-column:span 6}
}
@media(max-width:580px){
 main{padding:15px}.topbar{align-items:flex-start;flex-direction:column}
 h1{font-size:23px}.stat{grid-column:span 12}
 .form-row{grid-template-columns:1fr}.account-balance{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">✦</div><div><h2>Mis Finanzas</h2><small>Tu dinero, organizado</small></div></div>
 <div>
  <div class="nav-label">MENÚ PRINCIPAL</div>
  <nav id="nav">
   <button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span>Resumen</button>
   <button class="nav-btn" data-page="accounts"><span class="nav-icon">▣</span>Cuentas</button>
   <button class="nav-btn" data-page="cash"><span class="nav-icon">▤</span>Efectivo</button>
   <button class="nav-btn" data-page="budgets"><span class="nav-icon">◷</span>Presupuestos</button>
   <button class="nav-btn" data-page="goals"><span class="nav-icon">◎</span>Objetivos</button>
   <button class="nav-btn" data-page="groups"><span class="nav-icon">▦</span>Grupos</button>
   <button class="nav-btn" data-page="moves"><span class="nav-icon">⇄</span>Movimientos</button>
  </nav>
 </div>
 <div class="sidebar-bottom">Tus datos se guardan en este dispositivo.</div>
</aside>
<main>
 <header class="topbar">
  <div><h1 id="pageTitle">Tu resumen financiero</h1><div class="subtitle" id="pageSubtitle">Una mirada clara a tu dinero.</div></div>
  <div class="actions">
   <button class="btn" onclick="exportData()">↓ Exportar</button>
   <button class="btn" onclick="document.getElementById('importFile').click()">↑ Importar</button>
   <input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)">
  </div>
 </header>
 <section id="view"></section>
</main>
</div>

<div class="modal-bg" id="modalBg">
 <div class="modal">
  <div class="modal-head"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div>
  <form id="modalForm">
   <div id="modalBody"></div>
   <div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div>
  </form>
 </div>
</div>

<script>
const KEY='mi_finanzas_v3';
const categories=['Comida','Transporte','Servicios','Entretenimiento','Salud','Hogar','Educación','Otros'];
const denominations=[
 {value:20000,color:'cream',animal:'Juan Bautista Alberdi'},
 {value:10000,color:'sky',animal:'Belgrano y Remedios del Valle'},
 {value:2000,color:'pink-note',animal:'Carrillo y Grierson'},
 {value:1000,color:'orange',animal:'Hornero / San Martín'},
 {value:500,color:'green-note',animal:'Yaguareté'},
 {value:200,color:'blue',animal:'Ballena Franca Austral'},
 {value:100,color:'violet',animal:'Taruca / Roca / Eva Perón'}
];
const defaults=()=>({accounts:[],moves:[],budgets:[],goals:[],groups:[],cash:{},usd:1000});
let data=loadData(),currentPage='home',modalAction=null;

function loadData(){
 try{
  let raw=localStorage.getItem(KEY)||localStorage.getItem('mi_finanzas_v2');
  if(raw){
   let d=JSON.parse(raw);
   return {...defaults(),...d,cash:d.cash||{},accounts:d.accounts||[],
    moves:(d.moves||[]).map(m=>({...m,category:m.category||'Otros'})),
    budgets:d.budgets||[],goals:d.goals||[],
    groups:(d.groups||[]).map(g=>({...g,color1:g.color1||'#45c9d6',
     color2:g.color2||'#9677f5',accountIds:g.accountIds||[],allocations:g.allocations||{}}))
   };
  }
 }catch(e){console.warn(e)}
 return defaults();
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n,c='ARS'){return new Intl.NumberFormat('es-AR',{style:'currency',currency:c,maximumFractionDigits:2}).format(Number(n)||0)}
function dateToday(){return new Date().toISOString().slice(0,10)}
function monthKey(d){return String(d||'').slice(0,7)}
function account(i){return data.accounts.find(a=>a.id===i)}
function accountName(i){return account(i)?.name||'Cuenta eliminada'}
function totalCash(){return denominations.reduce((s,n)=>s+n.value*(Number(data.cash[n.value])||0),0)}
function totalARS(){return data.accounts.reduce((s,a)=>s+(a.currency==='USD'?a.balance*data.usd:a.balance),0)+totalCash()}
function currencyOptions(selected='ARS'){return `<option value="ARS" ${selected==='ARS'?'selected':''}>Pesos argentinos (ARS)</option><option value="USD" ${selected==='USD'?'selected':''}>Dólares (USD)</option>`}
function accountOptions(selected=''){return data.accounts.map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.name)} · ${a.currency}</option>`).join('')}
function categoryOptions(selected='Otros'){return categories.map(c=>`<option ${c===selected?'selected':''}>${c}</option>`).join('')}
function colorFields(c1='#45c9d6',c2='#9677f5'){return `<div class="color-row"><div class="field"><label>Color principal</label><input type="color" name="color1" value="${c1}"></div><div class="field"><label>Color secundario</label><input type="color" name="color2" value="${c2}"></div></div>`}
function gradient(a){return `linear-gradient(130deg,${a.color1||'#45c9d6'},${a.color2||'#9677f5'})`}
function openModal(title,html,callback){
 modalAction=callback;document.getElementById('modalTitle').textContent=title;
 document.getElementById('modalBody').innerHTML=html;
 document.getElementById('modalBg').classList.add('open');
}
function closeModal(){document.getElementById('modalBg').classList.remove('open');modalAction=null}
document.getElementById('modalForm').addEventListener('submit',e=>{
 e.preventDefault();if(!modalAction)return;
 const obj=Object.fromEntries(new FormData(e.target).entries());
 const action=modalAction;modalAction=null;
 if(action(obj)!==false)closeModal();
});
function go(page){
 currentPage=page;
 document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 render();
}
document.getElementById('nav').addEventListener('click',e=>{
 const b=e.target.closest('[data-page]');if(b)go(b.dataset.page);
});
function setHeader(t,s){document.getElementById('pageTitle').textContent=t;document.getElementById('pageSubtitle').textContent=s}
function empty(t){return `<div class="empty">${t}</div>`}
function actionButtons(edit,del){return `<div class="item-actions"><button class="btn small" onclick="${edit}">Editar</button><button class="btn small danger" onclick="${del}">Eliminar</button></div>`}

function render(){
 save();const v=document.getElementById('view');
 const pages={
 home:['Tu resumen financiero','Una mirada clara a tu dinero.',homeView],
 accounts:['Tus cuentas','Organizá tus bancos, billeteras y ahorros.',accountsView],
 cash:['Efectivo','Contá tus billetes y calculá cuánto efectivo tenés.',cashView],
 budgets:['Presupuestos','Poné límites y seguí tus gastos por categoría.',budgetsView],
 goals:['Objetivos de ahorro','Dale seguimiento a lo que querés alcanzar.',goalsView],
 groups:['Tus grupos','Organizá tus cuentas en conjuntos personalizados.',groupsView],
 moves:['Movimientos','Registrá tus ingresos y egresos.',movesView]
 };
 const p=pages[currentPage];setHeader(p[0],p[1]);v.innerHTML=p[2]();
}
function homeView(){
 const recent=[...data.moves].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 const income=data.moves.filter(m=>m.type==='income'&&monthKey(m.date)===monthKey(dateToday())).reduce((s,m)=>s+m.amount,0);
 const expenses=data.moves.filter(m=>m.type==='expense'&&monthKey(m.date)===monthKey(dateToday())).reduce((s,m)=>s+m.amount,0);
 return `<div class="grid">
 <div class="card stat" style="--glow:#45c9d6"><div class="stat-icon">💎</div><div class="stat-label">Patrimonio en ARS</div><div class="stat-value">${money(totalARS())}</div><div class="stat-note">Cuentas + efectivo físico</div></div>
 <div class="card stat" style="--glow:#43d6a0"><div class="stat-icon">💵</div><div class="stat-label">Efectivo físico</div><div class="stat-value">${money(totalCash())}</div><div class="stat-note">Billetes argentinos</div></div>
 <div class="card stat" style="--glow:#ffad5c"><div class="stat-icon">🏦</div><div class="stat-label">Cuentas</div><div class="stat-value">${data.accounts.length}</div><div class="stat-note">Cuentas registradas</div></div>
 <div class="card stat" style="--glow:#f27da8"><div class="stat-icon">🎯</div><div class="stat-label">Objetivos</div><div class="stat-value">${data.goals.length}</div><div class="stat-note">Metas de ahorro</div></div>
 </div>
 <div class="section-head"><div><h2>Este mes</h2><p>Resumen de tus movimientos registrados.</p></div></div>
 <div class="grid">
 <div class="card span-6" style="border-left:4px solid var(--green)"><div class="stat-label">Ingresos registrados</div><div class="stat-value positive">${money(income)}</div></div>
 <div class="card span-6" style="border-left:4px solid var(--pink)"><div class="stat-label">Egresos registrados</div><div class="stat-value negative">${money(expenses)}</div></div>
 </div>
 <div class="section-head"><div><h2>Tu cotización</h2><p>Configurá manualmente cuánto vale un dólar en pesos.</p></div></div>
 <div class="card" style="border-left:4px solid var(--yellow)"><div class="form-row"><div><div class="stat-label">Cotización configurada</div><div class="stat-value">${money(data.usd,'ARS')} <span class="muted" style="font-size:14px">por USD 1</span></div></div><div style="display:flex;align-items:center;justify-content:flex-end"><button class="btn primary" onclick="editRate()">Cambiar cotización</button></div></div></div>
 <div class="section-head"><div><h2>Accesos rápidos</h2><p>Entrá directamente a cada sección.</p></div></div>
 <div class="quick-grid">
 <button class="quick-card q-cyan" onclick="addMove()"><span>⇄</span><strong>Nuevo movimiento</strong><small>Ingresos y egresos</small></button>
 <button class="quick-card q-green" onclick="addAccount()"><span>🏦</span><strong>Nueva cuenta</strong><small>Agregá una cuenta</small></button>
 <button class="quick-card q-orange" onclick="addBudget()"><span>◷</span><strong>Presupuesto</strong><small>Organizá tus gastos</small></button>
 <button class="quick-card q-pink" onclick="addGoal()"><span>🎯</span><strong>Objetivo</strong><small>Una nueva meta</small></button>
 <button class="quick-card q-blue" onclick="go('cash')"><span>💵</span><strong>Contar efectivo</strong><small>Revisá tus billetes</small></button>
 <button class="quick-card q-purple" onclick="addGroup()"><span>▦</span><strong>Crear grupo</strong><small>Organizá tus cuentas</small></button>
 </div>
 <div class="section-head"><div><h2>Últimos movimientos</h2><p>Tus registros más recientes.</p></div><button class="btn small" onclick="go('moves')">Ver todos</button></div>
 ${recent.length?`<div class="card table-wrap"><table><thead><tr><th>Fecha</th><th>Descripción</th><th>Cuenta</th><th>Categoría</th><th>Monto</th></tr></thead><tbody>${recent.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.desc)}</td><td>${esc(accountName(m.accountId))}</td><td>${esc(m.category)}</td><td class="${m.type==='income'?'positive':'negative'}">${m.type==='income'?'+':'−'} ${money(m.amount,m.currency)}</td></tr>`).join('')}</tbody></table></div>`:empty('Todavía no registraste movimientos.')}`;
}
function accountsView(){
 return `<div class="section-head"><div><h2>Todas tus cuentas</h2><p>El saldo se muestra en la moneda de cada cuenta.</p></div><button class="btn primary" onclick="addAccount()">＋ Nueva cuenta</button></div>
 ${data.accounts.length?`<div class="account-grid">${data.accounts.map(a=>`<div class="account-card" style="background:${gradient(a)}"><div class="account-top"><div><div class="account-type">${esc(a.type)} · ${a.currency}</div><div class="account-name">${esc(a.name)}</div></div><span>▣</span></div><div class="account-balance">${money(a.balance,a.currency)}</div><div class="account-actions"><button onclick="editAccount('${a.id}')">Editar</button><button onclick="deleteAccount('${a.id}')">Eliminar</button></div></div>`).join('')}</div>`:empty('Todavía no tenés cuentas. Agregá una para empezar.')}
 <div class="notice">El patrimonio convierte tus cuentas en dólares a pesos usando la cotización manual.</div>`;
}
function addAccount(a=null){
 openModal(a?'Editar cuenta':'Nueva cuenta',`<div class="field"><label>Nombre</label><input name="name" required maxlength="45" value="${esc(a?.name||'')}" placeholder="Ej. Banco, billetera..."></div>
 <div class="form-row"><div class="field"><label>Tipo de cuenta</label><select name="type">${['Banco','Billetera virtual','Efectivo','Ahorro','Inversión','Otra'].map(t=>`<option ${a?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Moneda</label><select name="currency">${currencyOptions(a?.currency||'ARS')}</select></div></div>
 <div class="field"><label>Saldo actual</label><input name="balance" type="number" step=".01" min="0" required value="${a?.balance??0}"></div>${colorFields(a?.color1,a?.color2)}`,o=>{
 const obj={...a,id:a?.id||id(),name:o.name.trim(),type:o.type,currency:o.currency,balance:Number(o.balance),color1:o.color1,color2:o.color2};
 if(a)data.accounts=data.accounts.map(x=>x.id===a.id?obj:x);else data.accounts.push(obj);
 save();render();
 });
}
function editAccount(i){const a=account(i);if(a)addAccount(a)}
function deleteAccount(i){if(data.moves.some(m=>m.accountId===i)){alert('Esta cuenta tiene movimientos asociados. Primero eliminá o reasigná esos movimientos.');return}if(confirm('¿Eliminar esta cuenta?')){data.accounts=data.accounts.filter(a=>a.id!==i);data.groups.forEach(g=>g.accountIds=(g.accountIds||[]).filter(x=>x!==i));save();render()}}
function cashView(){
 return `<div class="card">
 <div class="stat-label">Total de efectivo contado</div>
 <div class="cash-total">${money(totalCash())}</div>
 <p class="muted" style="font-size:12px">Ingresá cuántos billetes tenés de cada denominación.</p>
 <div class="actions" style="margin-top:15px">
  <button class="btn danger" onclick="clearCash()">⌫ Borrar todos los billetes</button>
 </div>
 </div>
 <div class="section-head"><div><h2>Contador de billetes</h2><p>Colores inspirados en los diseños de cada denominación.</p></div></div>
 <div class="cash-grid">${denominations.map(n=>`<div class="cash-note ${n.color}">
 <div class="denom">${money(n.value)}</div>
 <div class="animal">${n.animal}</div>
 <label style="font-size:11px;font-weight:700">Cantidad</label><br>
 <input type="number" min="0" step="1" value="${Number(data.cash[n.value])||0}" onchange="setCash(${n.value},this.value)">
 <div class="total">Total: ${money(n.value*(Number(data.cash[n.value])||0))}</div>
 </div>`).join('')}</div>`;
}
function setCash(n,v){
 data.cash[n]=Math.max(0,Math.floor(Number(v)||0));
 save();render();
}
function clearCash(){
 const hasBills=denominations.some(n=>(Number(data.cash[n.value])||0)>0);
 if(!hasBills){alert('El contador ya está en cero.');return}
 if(!confirm('¿Querés borrar todas las cantidades de billetes? Esta acción no se puede deshacer.'))return;
 data.cash={};
 save();
 render();
}
function editRate(){
 openModal('Cotización del dólar',`<div class="field"><label>¿Cuántos pesos vale 1 USD?</label><input type="number" name="rate" min=".01" step=".01" required value="${data.usd}"></div>`,o=>{
 data.usd=Number(o.rate);save();render();
 });
}
function budgetSpent(b){
 return data.moves.filter(m=>m.type==='expense'&&m.category===b.category&&m.currency===b.currency&&monthKey(m.date)===monthKey(dateToday())).reduce((s,m)=>s+m.amount,0);
}
function budgetsView(){
 return `<div class="section-head"><div><h2>Presupuestos mensuales</h2><p>Seguimiento de gastos por categoría.</p></div><button class="btn primary" onclick="addBudget()">＋ Crear presupuesto</button></div>
 ${data.budgets.length?`<div class="item-grid">${data.budgets.map(b=>{const spent=budgetSpent(b),pct=b.limit?spent/b.limit*100:0;return `<div class="item-card"><h3>${esc(b.category)}</h3><p>Presupuesto mensual · ${b.currency}</p><div class="money">${money(spent,b.currency)} <span class="muted" style="font-size:12px">de ${money(b.limit,b.currency)}</span></div><div class="progress ${pct>100?'over':''}"><div style="width:${Math.min(pct,100)}%"></div></div><p>${pct.toFixed(1)}% utilizado · ${money(b.limit-spent,b.currency)} ${spent>b.limit?'por encima':'disponibles'}</p>${actionButtons(`editBudget('${b.id}')`,`deleteBudget('${b.id}')`)}</div>`}).join('')}</div>`:empty('Todavía no creaste presupuestos.')}`;
}
function addBudget(b=null){
 openModal(b?'Editar presupuesto':'Nuevo presupuesto',`<div class="field"><label>Categoría</label><select name="category">${categoryOptions(b?.category||'Comida')}</select></div><div class="form-row"><div class="field"><label>Moneda</label><select name="currency">${currencyOptions(b?.currency||'ARS')}</select></div><div class="field"><label>Límite mensual</label><input name="limit" type="number" min=".01" step=".01" required value="${b?.limit??''}"></div></div>`,o=>{
 const obj={id:b?.id||id(),category:o.category,currency:o.currency,limit:Number(o.limit)};
 if(b)data.budgets=data.budgets.map(x=>x.id===b.id?obj:x);else data.budgets.push(obj);
 save();render();
 });
}
function editBudget(i){const b=data.budgets.find(x=>x.id===i);if(b)addBudget(b)}
function deleteBudget(i){if(confirm('¿Eliminar este presupuesto?')){data.budgets=data.budgets.filter(b=>b.id!==i);save();render()}}
function goalsView(){
 return `<div class="section-head"><div><h2>Mis objetivos</h2><p>Ahorrá de a poco y seguí tu progreso.</p></div><button class="btn primary" onclick="addGoal()">＋ Nuevo objetivo</button></div>
 ${data.goals.length?`<div class="item-grid">${data.goals.map(g=>{const pct=g.target?g.saved/g.target*100:0;return `<div class="item-card"><h3>${esc(g.name)}</h3><p>${g.date?'Fecha objetivo: '+esc(g.date):'Sin fecha objetivo'} · ${g.currency}</p><div class="money">${money(g.saved,g.currency)}</div><div class="progress"><div style="width:${Math.min(100,pct)}%"></div></div><p>${pct.toFixed(1)}% alcanzado · Faltan ${money(Math.max(0,g.target-g.saved),g.currency)}</p><div class="item-actions"><button class="btn small green" onclick="contributeGoal('${g.id}')">＋ Aportar</button><button class="btn small" onclick="editGoal('${g.id}')">Editar</button><button class="btn small danger" onclick="deleteGoal('${g.id}')">Eliminar</button></div></div>`}).join('')}</div>`:empty('Todavía no tenés objetivos de ahorro.')}`;
}
function addGoal(g=null){
 openModal(g?'Editar objetivo':'Nuevo objetivo',`<div class="field"><label>Nombre</label><input name="name" required maxlength="60" value="${esc(g?.name||'')}"></div><div class="form-row"><div class="field"><label>Moneda</label><select name="currency">${currencyOptions(g?.currency||'ARS')}</select></div><div class="field"><label>Meta total</label><input name="target" type="number" min=".01" step=".01" required value="${g?.target??''}"></div></div><div class="field"><label>Ya ahorrado</label><input name="saved" type="number" min="0" step=".01" required value="${g?.saved??0}"></div><div class="field"><label>Fecha objetivo opcional</label><input name="date" type="date" value="${g?.date||''}"></div>`,o=>{
 const obj={id:g?.id||id(),name:o.name.trim(),currency:o.currency,target:Number(o.target),saved:Number(o.saved),date:o.date};
 if(g)data.goals=data.goals.map(x=>x.id===g.id?obj:x);else data.goals.push(obj);
 save();render();
 });
}
function editGoal(i){const g=data.goals.find(x=>x.id===i);if(g)addGoal(g)}
function deleteGoal(i){if(confirm('¿Eliminar este objetivo?')){data.goals=data.goals.filter(g=>g.id!==i);save();render()}}
function contributeGoal(i){
 const g=data.goals.find(x=>x.id===i);if(!g)return;
 openModal('Aportar al objetivo',`<div class="field"><label>Monto del aporte (${g.currency})</label><input name="amount" type="number" min=".01" step=".01" required></div>`,o=>{
 g.saved+=Number(o.amount);save();render();
 });
}
function groupsView(){
 return `<div class="section-head"><div><h2>Tus grupos</h2><p>Los grupos muestran el total de las cuentas que seleccionaste.</p></div><button class="btn primary" onclick="addGroup()">＋ Crear grupo</button></div>
 ${data.groups.length?`<div class="group-grid">${data.groups.map(g=>{
 const members=(g.accountIds||[]).map(account).filter(Boolean);
 const ars=members.filter(a=>a.currency==='ARS').reduce((s,a)=>s+a.balance,0);
 const usd=members.filter(a=>a.currency==='USD').reduce((s,a)=>s+a.balance,0);
 return `<div class="group-card" style="background:${gradient(g)}">
 <div class="account-top"><div><div class="account-type">GRUPO PERSONALIZADO</div><div class="account-name">${esc(g.name)}</div></div><span style="font-size:21px">▦</span></div>
 <div class="group-balances">
 <div class="group-balance"><small>Saldo en pesos</small><strong>${money(ars,'ARS')}</strong></div>
 <div class="group-balance"><small>Saldo en dólares</small><strong>${money(usd,'USD')}</strong></div>
 </div>
 <div class="group-members"><b>${members.length} cuenta(s) incluidas</b><br>${members.length?members.map(a=>`• ${esc(a.name)}: ${money(a.balance,a.currency)}`).join('<br>'):'Todavía no agregaste cuentas'}</div>
 <div class="account-actions"><button onclick="editGroup('${g.id}')">Editar</button><button onclick="deleteGroup('${g.id}')">Eliminar</button></div>
 </div>`;
 }).join('')}</div>`:empty('Todavía no creaste grupos.')}
 <div class="notice">Los saldos de los grupos son informativos. No se suman nuevamente al patrimonio general.</div>`;
}
function addGroup(g=null){
 const selected=g?.accountIds||[],current=g?.allocations||{};
 const checkboxes=data.accounts.map(a=>`<label><input type="checkbox" name="accounts" value="${a.id}" ${selected.includes(a.id)?'checked':''}> ${esc(a.name)} (${a.currency} · ${money(a.balance,a.currency)})</label>`).join('');
 openModal(g?'Editar grupo':'Nuevo grupo',`
 <div class="field"><label>Nombre del grupo</label><input name="name" required maxlength="45" value="${esc(g?.name||'')}" placeholder="Ej. Gastos del mes"></div>
 ${colorFields(g?.color1,g?.color2)}
 <div class="field"><label>Cuentas que pertenecen al grupo</label><div class="check-list">${checkboxes||'<span class="muted">Primero agregá una cuenta.</span>'}</div></div>
 <div class="field"><label>Distribución porcentual por categoría</label><p class="muted">Opcional. Si completás porcentajes, deben sumar 100%.</p>
 ${categories.map(c=>`<div class="form-row" style="align-items:center"><label>${c}</label><input name="alloc_${c}" type="number" min="0" max="100" step="1" placeholder="0" value="${current[c]??''}"></div>`).join('')}
 </div>`,o=>{
 const accountIds=[...document.querySelectorAll('#modalBody input[name="accounts"]:checked')].map(x=>x.value);
 const allocations={};let sum=0;
 categories.forEach(c=>{const n=Number(o['alloc_'+c]||0);if(n>0){allocations[c]=n;sum+=n}});
 if(sum>0&&sum!==100){alert('Los porcentajes deben sumar exactamente 100%.');return false}
 const obj={id:g?.id||id(),name:o.name.trim(),color1:o.color1,color2:o.color2,accountIds,allocations};
 if(g)data.groups=data.groups.map(x=>x.id===g.id?obj:x);else data.groups.push(obj);
 save();render();
 });
}
function editGroup(i){const g=data.groups.find(x=>x.id===i);if(g)addGroup(g)}
function deleteGroup(i){if(confirm('¿Eliminar este grupo? Las cuentas no se eliminarán.')){data.groups=data.groups.filter(g=>g.id!==i);save();render()}}
function movesView(){
 const list=[...data.moves].sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="section-head"><div><h2>Historial de movimientos</h2><p>Ingresos y egresos de todas tus cuentas.</p></div><button class="btn primary" onclick="addMove()">＋ Registrar movimiento</button></div>
 ${list.length?`<div class="card table-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th>Categoría</th><th>Cuenta</th><th>Monto</th><th>Acciones</th></tr></thead><tbody>${list.map(m=>`<tr><td>${esc(m.date)}</td><td>${m.type==='income'?'Ingreso':'Egreso'}</td><td>${esc(m.desc)}</td><td>${esc(m.category)}</td><td>${esc(accountName(m.accountId))}</td><td class="${m.type==='income'?'positive':'negative'}">${m.type==='income'?'+':'−'} ${money(m.amount,m.currency)}</td><td><button class="btn small" onclick="editMove('${m.id}')">Editar</button> <button class="btn small danger" onclick="deleteMove('${m.id}')">Borrar</button></td></tr>`).join('')}</tbody></table></div>`:empty('Todavía no hay movimientos registrados.')}`;
}
function addMove(m=null){
 if(!data.accounts.length){alert('Primero necesitás crear una cuenta.');return}
 openModal(m?'Editar movimiento':'Nuevo movimiento',`
 <div class="form-row"><div class="field"><label>Tipo</label><select name="type"><option value="expense" ${m?.type!=='income'?'selected':''}>Egreso</option><option value="income" ${m?.type==='income'?'selected':''}>Ingreso</option></select></div><div class="field"><label>Fecha</label><input name="date" type="date" required value="${m?.date||dateToday()}"></div></div>
 <div class="field"><label>Descripción</label><input name="desc" required maxlength="80" value="${esc(m?.desc||'')}"></div>
 <div class="form-row"><div class="field"><label>Cuenta</label><select name="accountId" required>${accountOptions(m?.accountId||data.accounts[0].id)}</select></div><div class="field"><label>Monto</label><input name="amount" type="number" min=".01" step=".01" required value="${m?.amount??''}"></div></div>
 <div class="field"><label>Categoría</label><select name="category">${categoryOptions(m?.category||'Otros')}</select></div>`,o=>{
 const a=account(o.accountId),amount=Number(o.amount);
 if(!a||!Number.isFinite(amount)||amount<=0){alert('Revisá la cuenta y el monto.');return false}
 if(m)applyMoveEffect(m,-1);
 const obj={id:m?.id||id(),type:o.type,date:o.date,desc:o.desc.trim(),accountId:o.accountId,amount,currency:a.currency,category:o.category};
 if(m)data.moves=data.moves.map(x=>x.id===m.id?obj:x);else data.moves.push(obj);
 applyMoveEffect(obj,1);save();render();
 });
}
function applyMoveEffect(m,direction){const a=account(m.accountId);if(a)a.balance+=(m.type==='income'?1:-1)*m.amount*direction}
function editMove(i){const m=data.moves.find(x=>x.id===i);if(m)addMove(m)}
function deleteMove(i){
 const m=data.moves.find(x=>x.id===i);if(!m)return;
 if(!confirm('¿Eliminar este movimiento? Se revertirá su efecto en el saldo.'))return;
 applyMoveEffect(m,-1);data.moves=data.moves.filter(x=>x.id!==i);save();render();
}
function exportData(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='respaldo_mis_finanzas.json';a.click();URL.revokeObjectURL(url);
}
function importData(event){
 const file=event.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const d=JSON.parse(reader.result);
   if(!d||typeof d!=='object'||!Array.isArray(d.accounts)||!Array.isArray(d.moves))throw Error();
   if(!confirm('Importar reemplazará los datos actuales. ¿Querés continuar?'))return;
   data={...defaults(),...d,cash:d.cash||{},accounts:d.accounts,
    moves:d.moves.map(m=>({...m,category:m.category||'Otros'})),
    budgets:Array.isArray(d.budgets)?d.budgets:[],
    goals:Array.isArray(d.goals)?d.goals:[],
    groups:Array.isArray(d.groups)?d.groups.map(g=>({...g,accountIds:g.accountIds||[],color1:g.color1||'#45c9d6',color2:g.color2||'#9677f5'})):[]
   };
   save();render();alert('Respaldo importado correctamente.');
  }catch(e){alert('No se pudo importar el archivo. Verificá que sea un respaldo válido.')}
  event.target.value='';
 };
 reader.readAsText(file);
}
render();
</script>
</body>
</html>
